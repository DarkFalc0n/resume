name: Build and Release Resume PDF

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create private.tex from secret (if configured)
        env:
          PRIVATE_TEX: ${{ secrets.PRIVATE_TEX }}
        run: |
          if [ -n "$PRIVATE_TEX" ]; then
            echo "$PRIVATE_TEX" > private.tex
            echo "Successfully generated private.tex from secret."
          else
            echo "No PRIVATE_TEX secret detected. Building with default placeholders."
          fi

      - name: Compile LaTeX Resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Password Protect PDF (if secret set)
        env:
          PDF_PASSWORD: ${{ secrets.PDF_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y qpdf
          if [ -n "$PDF_PASSWORD" ]; then
            qpdf --encrypt "$PDF_PASSWORD" "$PDF_PASSWORD" 256 -- main.pdf PratyayRoyResume.pdf
            echo "Successfully encrypted PDF with 256-bit AES."
          else
            echo "No PDF_PASSWORD secret found. Saving unencrypted PDF."
            mv main.pdf PratyayRoyResume.pdf
          fi

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PratyayRoyResume-PDF
          path: PratyayRoyResume.pdf

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'PratyayRoyResume-latest' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          files: PratyayRoyResume.pdf
          generate_release_notes: true
