name: Build and Release Resume PDF

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create private.tex from secret (if configured)
        env:
          PRIVATE_TEX: ${{ secrets.PRIVATE_TEX }}
        run: |
          if [ -n "$PRIVATE_TEX" ]; then
            echo "$PRIVATE_TEX" > private.tex
            echo "Successfully generated private.tex from secret."
          else
            echo "No PRIVATE_TEX secret detected. Building with default placeholders."
          fi

      - name: Compile LaTeX Resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Rename PDF output
        run: |
          mv main.pdf PratyayRoyResume.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PratyayRoyResume-PDF
          path: PratyayRoyResume.pdf

      - name: Create Release (on Tag or Manual Run)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: PratyayRoyResume-${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: PratyayRoyResume.pdf
          generate_release_notes: true
