name: Build and Release Resume PDF

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create private.tex from secret (if configured)
        env:
          PRIVATE_TEX: ${{ secrets.PRIVATE_TEX }}
        run: |
          if [ -n "$PRIVATE_TEX" ]; then
            echo "$PRIVATE_TEX" > private.tex
            echo "Successfully generated private.tex from secret."
          else
            echo "No PRIVATE_TEX secret detected. Building with default placeholders."
          fi

      - name: Set Release Date
        run: |
          echo "DATE=$(date +'%y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Compile LaTeX Resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Password Protect PDF (if secret set)
        env:
          PDF_PASSWORD: ${{ secrets.PDF_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y qpdf
          OUTPUT_NAME="PratyayRoyResume_${DATE}.pdf"
          if [ -n "$PDF_PASSWORD" ]; then
            qpdf --encrypt "$PDF_PASSWORD" "$PDF_PASSWORD" 256 -- main.pdf "$OUTPUT_NAME"
            echo "Successfully encrypted PDF with 256-bit AES as $OUTPUT_NAME."
          else
            echo "No PDF_PASSWORD secret found. Saving unencrypted PDF as $OUTPUT_NAME."
            mv main.pdf "$OUTPUT_NAME"
          fi

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PratyayRoyResume-${{ env.DATE }}
          path: PratyayRoyResume_${{ env.DATE }}.pdf

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('PratyayRoyResume-{0}', env.DATE) }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.DATE) }}
          files: PratyayRoyResume_${{ env.DATE }}.pdf
          generate_release_notes: true
